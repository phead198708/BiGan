name: v8 Phase 0 hard gates

on:
  pull_request:
    paths:
      - "src/bigan/v8/**"
      - "tests/v8/**"
      - "docs/v8/**"
      - ".github/workflows/v8-phase0.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  phase0:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint v8 Phase 0
        run: python -m ruff check src/bigan/v8 tests/v8

      - name: Run v8 Phase 0 hard-gate tests
        run: python -m pytest tests/v8/test_phase0.py -q
