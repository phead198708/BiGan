name: v8 hard gates

on:
  pull_request:
    paths:
      - "src/bigan/v8/**"
      - "examples/v8/**"
      - "tests/v8/**"
      - "docs/v8/**"
      - ".github/workflows/v8-phase0.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  v8-hard-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up exact test interpreter
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install exact hash-locked deployment graph
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r examples/v8/residual_promotion_runtime-linux-x86_64.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify frozen deployment runtime matrix
        run: |
          python examples/v8/verify_residual_promotion_runtime_matrix.py --static-only

      - name: Lint v8
        run: python -m ruff check src/bigan/v8 tests/v8 examples/v8

      - name: Run residual v3 terminal governance tests
        run: python -m pytest tests/v8/test_residual_v3_terminal_review.py tests/v8/test_residual_v3_frozen_binding_audit.py -q

      - name: Run residual v4 terminal governance tests
        run: python -m pytest tests/v8/test_cost_aware_residual_v4.py tests/v8/test_cost_aware_residual_v4_stacking.py tests/v8/test_residual_v4_terminal_review.py -q

      - name: Run pooled residual offline runtime-readiness tests
        run: python -m pytest tests/v8/test_pooled_residual_runtime.py -q

      - name: Run v8 hard-gate tests
        run: python -m pytest tests/v8/test_phase0.py tests/v8/test_phase1.py tests/v8/test_phase1_training.py tests/v8/test_phase2.py tests/v8/test_phase3.py tests/v8/test_phase4.py tests/v8/test_phase5.py tests/v8/test_phase6.py tests/v8/test_e2e_golden_path.py tests/v8/test_paper_harness.py tests/v8/test_paper_soak.py tests/v8/test_readonly_shadow_soak.py tests/v8/test_paper_observability.py tests/v8/test_paper_alert_delivery.py tests/v8/test_24h_paper_operator_cli.py tests/v8/test_live_readonly_feed.py tests/v8/test_live_24h_paper_operator.py tests/v8/test_polymarket_contracts.py tests/v8/test_polymarket_btc15m_adapter.py tests/v8/test_polymarket_paper_pipeline.py tests/v8/test_polymarket_rules.py tests/v8/test_polymarket_ledger.py tests/v8/test_polymarket_settlement_engine.py tests/v8/test_polymarket_corpus_contracts.py tests/v8/test_polymarket_corpus_builder.py tests/v8/test_polymarket_corpus_point_in_time.py tests/v8/test_polymarket_live_to_corpus.py tests/v8/test_polymarket_real_corpus_recorder_contracts.py tests/v8/test_polymarket_real_corpus_recorder_operator.py tests/v8/test_polymarket_real_corpus_training_gate.py tests/v8/test_polymarket_real_corpus_retraining_gate.py tests/v8/test_polymarket_real_public_provider.py tests/v8/test_polymarket_training_corpus_storage.py tests/v8/test_polymarket_policy_training.py tests/v8/test_polymarket_policy_calibration.py tests/v8/test_polymarket_ev_execution.py tests/v8/test_polymarket_live_feed_contracts.py tests/v8/test_polymarket_live_paper_operator.py tests/v8/test_polymarket_live_settlement_path.py tests/v8/test_moe_confirmatory_evaluation.py tests/v8/test_moe_terminal_diagnostic.py tests/v8/test_raw_capture_archive.py tests/v8/test_cost_aware_residual.py tests/v8/test_cost_aware_residual_v2.py tests/v8/test_cost_aware_residual_v2_uncertainty.py tests/v8/test_residual_v2_terminal_review.py tests/v8/test_cost_aware_residual_v3.py tests/v8/test_cost_aware_residual_v3_logit.py -q

      - name: Run issue 264 integration-closure and residual lineage gates
        run: |
          python -m pytest \
            tests/v8/test_issue264_integration_closure.py \
            tests/v8/test_cost_aware_residual_v5.py \
            tests/v8/test_cost_aware_residual_v6.py \
            -q
          python -m bigan.v8.integration_closure verify-all \
            examples/v8/integration_closure --root .

      - name: Run residual promotion v1 frozen runtime and recorder gates
        run: |
          python -m pytest \
            tests/v8/test_residual_promotion_v1.py \
            tests/v8/test_residual_promotion_finalization.py \
            tests/v8/test_residual_promotion_evaluation.py \
            tests/v8/test_residual_promotion_settlement.py \
            tests/v8/test_residual_promotion_rollback.py \
            tests/v8/test_residual_promotion_release_readiness.py \
            tests/v8/test_residual_promotion_security_review.py \
            tests/v8/test_residual_promotion_security_review_v2.py \
            tests/v8/test_residual_promotion_runtime.py \
            tests/v8/test_residual_promotion_micro_live_executor.py \
            tests/v8/test_residual_promotion_release_evidence.py \
            tests/v8/test_residual_promotion_execution_readiness.py \
            tests/v8/test_residual_promotion_signal_feed.py \
            tests/v8/test_residual_promotion_capture_archive.py \
            tests/v8/test_residual_promotion_service_root_migration.py \
            tests/v8/test_polymarket_async_settlement.py \
            -q

  exact-deployment-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: python:3.12.4-slim-bookworm@sha256:a074fac67aa01841fee592d00bae14d25dcaf98ef6e12a683ecceb7e0147e2d1
    env:
      BIGAN_DEPLOYMENT_IMAGE_MANIFEST_DIGEST: sha256:a074fac67aa01841fee592d00bae14d25dcaf98ef6e12a683ecceb7e0147e2d1

    steps:
      - name: Check out repository without deployment mutation
        uses: actions/checkout@v4

      - name: Install exact hash-locked deployment graph
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r examples/v8/residual_promotion_runtime-linux-x86_64.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify exact deployment image, ABI, and distribution graph
        run: python examples/v8/verify_residual_promotion_runtime_matrix.py
