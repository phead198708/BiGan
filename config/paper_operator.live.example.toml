# Live PUBLIC feeds with simulated paper execution only. No real funds.
# This template MUST fail preflight until its source matches a verified wheel.
# Read the installed identity with: python -m bigan.build_provenance
# Do not commit your deployment-specific copy.
operator_id = "btc-paper-operator"
strategy_id = "alpha-pricing-v1"
paper_account_id = "paper-usdc-demo"
source_commit = "replace-with-verified-build-source-commit"
output_dir = "data/paper_operator_live"

underlying = "BTC"
market_type = "binary_up_down"
window_duration_ms = 900000
# Omit slug_pattern to derive the canonical family from underlying + duration.
# BTC sources must be BTCUSDT + btc/usd (ETH: ETHUSDT + eth/usd).
max_preopen_ms = 1800000

gamma_markets_endpoint = "https://gamma-api.polymarket.com/markets"
resolution_endpoint = "https://gamma-api.polymarket.com/markets"
# Read-only website API; window/asset/TWAP identity and response hash are persisted.
opening_reference_endpoint = "https://polymarket.com/api/crypto/crypto-price"
# Separate venue, not a fallback/mirror of Binance Global. Use only where applicable.
binance_venue = "us"
binance_depth_endpoint = "https://api.binance.us/api/v3/depth"
binance_ws_url = "wss://stream.binance.us:9443/ws"
binance_symbol = "BTCUSDT"
# Buffer small exchange-clock leads until local time catches up; never trade ahead.
binance_clock_ahead_tolerance_ms = 50
polymarket_ws_url = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
chainlink_ws_url = "wss://ws-live-data.polymarket.com"
chainlink_symbol = "btc/usd"

max_alpha_age_ms = 2000
max_market_age_ms = 5000
max_pricing_age_ms = 5000
binance_queue_size = 10000
market_queue_size = 10000
binance_delta_buffer_size = 5000
binance_book_level_limit = 5000 # Must be >= 1000 REST snapshot levels per side.

twap_window_ms = 900000
volatility_return_interval_ms = 1000
volatility_window_ms = 300000
volatility_min_samples = 20
volatility_max_abs_log_return = 0.20
pricing_sample_buffer_size = 10000

initial_bankroll = 1000.0
fee_bps = 0.0
max_single_trade_pct = 0.05
max_position_pct = 0.25
max_window_exposure_pct = 0.25
snapshot_lru_size = 10000

# dry_run=false runs the public-feed PAPER loop, never a real trading path.
mock = false
dry_run = false
config_check_only = false
paper_only = true
capital_at_risk = false
broker_exchange_write_enabled = false
live_exchange_write_enabled = false
polymarket_write_enabled = false
wallet_signing_enabled = false
